services:
  - type: web
    name: cv-parser-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cv-parser-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: cv-parser-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: cv-parser-db
    databaseName: cvparser
    user: cvparser
    plan: free
